<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrootBrak Squash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  /* ============ TOKENS ============ */
  :root{
    --bg:#F2ECDD;
    --bg-glow: 226 163 53; /* rgb triplet of accent, for radial glow use */
    --surface:#FFFFFF;
    --surface-2:#FBF5E7;
    --raised:#FFFFFF;
    --ink:#1C2A2E;
    --ink-soft:#5B6A6D;
    --ink-faint:#6E7A73;
    --line:#E3D9BE;
    --line-soft:#ECE3CC;
    --accent:#C9861E;
    --accent-strong:#A56A11;
    --accent-ink:#241705;
    --accent-soft: 226 163 53;
    --good:#2F7A50;
    --good-soft:#E4F1E7;
    --warn:#B23D22;
    --warn-soft:#F7E4DD;
    --shadow: 28 30 20;
    --frame-bezel:#0C1116;
    --frame-trim:#23282C;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0C161C;
      --surface:#131F26;
      --surface-2:#0F1920;
      --raised:#182530;
      --ink:#EFEAE0;
      --ink-soft:#9FB2B7;
      --ink-faint:#6E848A;
      --line:#233039;
      --line-soft:#1B2730;
      --accent:#F4B942;
      --accent-strong:#FFCE72;
      --accent-ink:#1B1200;
      --good:#63B383;
      --good-soft:#152A20;
      --warn:#E2604B;
      --warn-soft:#2E1712;
      --shadow: 0 0 0;
      --frame-bezel:#05080B;
      --frame-trim:#181D22;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0C161C;
    --surface:#131F26;
    --surface-2:#0F1920;
    --raised:#182530;
    --ink:#EFEAE0;
    --ink-soft:#9FB2B7;
    --ink-faint:#6E848A;
    --line:#233039;
    --line-soft:#1B2730;
    --accent:#F4B942;
    --accent-strong:#FFCE72;
    --accent-ink:#1B1200;
    --good:#63B383;
    --good-soft:#152A20;
    --warn:#E2604B;
    --warn-soft:#2E1712;
    --shadow: 0 0 0;
    --frame-bezel:#05080B;
    --frame-trim:#181D22;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100dvh;
  }
  h1,h2,h3,.display{
    font-family:'Big Shoulders Display','Work Sans',system-ui,sans-serif;
    text-transform:uppercase;
    letter-spacing:.01em;
    text-wrap:balance;
    font-weight:800;
    margin:0;
  }
  button, input, select, textarea{font-family:inherit; color:inherit;}
  button{cursor:pointer;}
  button:focus-visible, a:focus-visible, input:focus-visible, .tap:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  ::selection{background:rgba(var(--accent-soft)/.35);}

  /* ============ OUTER STAGE (desktop presentation) ============ */
  #stage{
    position:relative;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    overflow:hidden;
  }
  #stage::before{
    content:"";
    position:absolute; inset:-20%;
    background:radial-gradient(ellipse 520px 420px at 50% 38%, rgba(var(--accent-soft)/.16), transparent 70%);
    pointer-events:none;
  }
  .stage-caption{
    position:absolute; left:0; right:0; bottom:18px;
    text-align:center;
    font-size:12px; color:var(--ink-faint);
    letter-spacing:.06em; text-transform:uppercase;
    font-weight:600;
  }

  /* ============ DEVICE FRAME ============ */
  #phone{
    position:relative;
    width:390px; height:844px;
    background:var(--frame-bezel);
    border-radius:52px;
    padding:14px;
    box-shadow:
      0 30px 60px -20px rgba(var(--shadow)/.45),
      0 2px 0 rgba(255,255,255,.03) inset;
    flex:none;
    animation:phone-in .5s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes phone-in{ from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:none;} }
  #phone::after{
    content:"";
    position:absolute; left:50%; top:30px; transform:translateX(-50%);
    width:110px; height:26px; background:var(--frame-trim); border-radius:14px;
    z-index:5;
  }
  #screen{
    position:relative;
    width:100%; height:100%;
    background:var(--bg);
    border-radius:38px;
    overflow:hidden;
    display:flex; flex-direction:column;
    border:1px solid rgba(255,255,255,.04);
  }
  #home-indicator{
    position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
    width:134px; height:5px; border-radius:3px; background:var(--ink);
    opacity:.35; z-index:20;
  }

  /* ============ STATUS BAR ============ */
  .statusbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 26px 4px; font-size:14px; font-weight:600;
    color:var(--ink); flex:none; letter-spacing:.02em;
  }
  .statusbar .sb-icons{display:flex; gap:6px; align-items:center;}

  /* ============ APP BAR ============ */
  .appbar{
    display:flex; align-items:center; gap:10px;
    padding:6px 18px 14px; flex:none;
  }
  .appbar h1{font-size:26px; line-height:1.05; flex:1; color:var(--ink);}
  .appbar .sub{font-size:12px; color:var(--ink-faint); font-weight:600; text-transform:none; letter-spacing:0; font-family:'Work Sans'; margin-top:2px;}
  .iconbtn{
    width:38px; height:38px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .iconbtn svg{width:18px; height:18px; stroke:var(--ink); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

  /* ============ SCROLL AREA ============ */
  .viewport{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;}
  .viewport::-webkit-scrollbar{width:0;}
  .pad{padding:0 18px 18px;}

  /* ============ TAB BAR ============ */
  .tabbar{
    display:flex; flex:none; background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));
  }
  .tabbtn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; padding:6px 2px; border-radius:12px;
    color:var(--ink-faint); font-size:10.5px; font-weight:700;
    letter-spacing:.04em; text-transform:uppercase;
  }
  .tabbtn svg{width:21px; height:21px; stroke:var(--ink-faint); fill:none; stroke-width:1.8;}
  .tabbtn.active{color:var(--accent-strong);}
  .tabbtn.active svg{stroke:var(--accent-strong); fill:rgba(var(--accent-soft)/.14);}

  /* ============ TYPE HELPERS ============ */
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-strong);}
  .muted{color:var(--ink-soft);}
  .faint{color:var(--ink-faint);}
  .num{font-variant-numeric:tabular-nums;}
  p{margin:0; line-height:1.5;}

  /* ============ CARD / SURFACE ============ */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:16px;
  }
  .stack{display:flex; flex-direction:column; gap:12px;}
  .row{display:flex; align-items:center; gap:10px;}
  .between{justify-content:space-between;}

  /* ============ BUTTONS ============ */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px 18px; border-radius:14px; border:1px solid transparent;
    font-weight:700; font-size:15px; letter-spacing:.01em;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.4;}
  .btn-secondary{background:var(--surface); color:var(--ink); border-color:var(--line);}
  .btn-ghost{background:none; color:var(--ink-soft); border-color:transparent; font-weight:600;}
  .btn-danger{background:var(--warn); color:#fff;}
  .btn-sm{padding:9px 14px; font-size:13px; border-radius:11px; width:auto;}

  /* ============ CHIPS / PILLS ============ */
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px;
    font-size:12px; font-weight:700; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
  }
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .pill-good{background:var(--good-soft); color:var(--good); border:none; font-weight:700; font-size:11px; padding:4px 9px; border-radius:99px; letter-spacing:.03em;}
  .pill-warn{background:var(--warn-soft); color:var(--warn); border:none; font-weight:700; font-size:11px; padding:4px 9px; border-radius:99px; letter-spacing:.03em;}
  .pill-accent{background:rgba(var(--accent-soft)/.16); color:var(--accent-strong); border:none; font-weight:700; font-size:11px; padding:4px 9px; border-radius:99px; letter-spacing:.03em;}

  /* ============ FORM ============ */
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
  .field input, .field select{
    width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--surface); font-size:15px; color:var(--ink);
  }
  .field input::placeholder{color:var(--ink-faint);}
  .checkline{display:flex; align-items:flex-start; gap:10px; font-size:13px; color:var(--ink-soft); line-height:1.45;}
  .checkline input{margin-top:3px; width:18px; height:18px; accent-color:var(--accent);}

  /* ============ SCHEDULE GRID ============ */
  .datebar{display:flex; gap:8px; overflow-x:auto; padding:2px 18px 14px; scrollbar-width:none;}
  .datebar::-webkit-scrollbar{display:none;}
  .datechip{
    flex:none; width:52px; padding:9px 0 8px; border-radius:14px; text-align:center;
    background:var(--surface); border:1px solid var(--line); font-weight:700;
  }
  .datechip .d{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; font-weight:700;}
  .datechip .n{font-size:17px; font-family:'Big Shoulders Display'; font-weight:800; margin-top:2px;}
  .datechip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .datechip.active .d{color:var(--accent-ink); opacity:.75;}

  /* ============ COURT TOGGLE + QUICK-JUMP (pinned while the list scrolls) ============ */
  .sched-pinned{
    position:sticky; top:0; z-index:6; background:var(--bg);
    padding-top:2px; padding-bottom:6px; box-shadow:0 8px 10px -8px rgba(var(--shadow)/.12);
  }
  .courttoggle{margin:0 18px 10px;}
  .quickjump{display:flex; gap:6px; overflow-x:auto; padding:0 18px 2px; scrollbar-width:none; flex:none;}
  .quickjump::-webkit-scrollbar{display:none;}
  .qchip{
    flex:none; padding:7px 13px; border-radius:99px; border:1px solid var(--line);
    background:var(--surface); font-size:12px; font-weight:700; color:var(--ink-soft);
  }
  .qchip.now{border-color:var(--good); color:var(--good);}

  /* ============ TIME LIST (single-court slot picker) ============ */
  .timelist{padding:0 0 18px;}
  .sectionhead{
    background:var(--bg); scroll-margin-top:100px;
    padding:10px 18px 6px; font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.08em; color:var(--ink-faint); border-bottom:1px solid var(--line-soft);
  }
  .nowline{display:flex; align-items:center; gap:8px; padding:6px 18px; scroll-margin-top:100px;}
  .nowline .ln{flex:1; height:1px; background:var(--good);}
  .nowline .lb{font-size:10px; font-weight:800; color:var(--good); letter-spacing:.06em;}
  .timerow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:13px 18px; border:none; border-bottom:1px solid var(--line-soft); background:none;
  }
  .timerow .tm{width:50px; flex:none; font-weight:800; font-variant-numeric:tabular-nums; font-size:13.5px; color:var(--ink-soft);}
  .timerow .dot{width:8px; height:8px; border-radius:50%; flex:none; background:var(--ink-faint); opacity:.4;}
  .timerow .info{flex:1; min-width:0;}
  .timerow .t1{font-weight:700; font-size:14.5px; color:var(--ink-soft);}
  .timerow .t2{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}
  .timerow .chev{flex:none; opacity:.35;}
  .timerow.mine{background:rgba(var(--accent-soft)/.12);}
  .timerow.mine .dot{background:var(--accent); opacity:1;}
  .timerow.mine .t1{color:var(--accent-strong);}
  .timerow.active{background:var(--good-soft);}
  .timerow.active .dot{background:var(--good); opacity:1;}
  .timerow.active .t1{color:var(--good);}
  .timerow.other .dot{background:var(--ink-soft); opacity:.7;}
  .timerow.other .t1{color:var(--ink-soft);}
  .timerow.cont{padding-top:2px; padding-bottom:2px;}
  .timerow.cont .tm{opacity:.4;}
  .live-tag{
    font-size:8.5px; font-weight:800; letter-spacing:.05em; background:var(--good); color:#fff;
    padding:2px 6px; border-radius:99px; margin-left:6px;
  }

  /* ============ LIST ROWS (bookings / ledger) ============ */
  .lrow{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line-soft);}
  .lrow:last-child{border-bottom:none;}
  .lrow .ico{
    width:40px; height:40px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); border:1px solid var(--line);
  }
  .lrow .ico svg{width:18px; height:18px; stroke:var(--ink-soft); fill:none; stroke-width:1.8;}
  .lrow .meta{flex:1; min-width:0;}
  .lrow .meta .t1{font-weight:700; font-size:14px;}
  .lrow .meta .t2{font-size:12px; color:var(--ink-faint); margin-top:1px;}
  .lrow .amt{font-weight:700; font-size:14px; text-align:right; flex:none; font-variant-numeric:tabular-nums;}
  .lrow .amt.neg{color:var(--ink);}
  .lrow .amt.pos{color:var(--good);}
  .lrow .bal{font-size:10.5px; color:var(--ink-faint); text-align:right; margin-top:2px; font-variant-numeric:tabular-nums;}

  /* ============ BALANCE TILES ============ */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px;}
  .tile .lab{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint);}
  .tile .val{font-family:'Big Shoulders Display'; font-size:28px; font-weight:800; margin-top:4px; letter-spacing:0; font-variant-numeric:tabular-nums;}

  /* ============ SHEET (bottom modal) ============ */
  #sheet-scrim{
    position:absolute; inset:0; background:rgba(0,0,0,.42); z-index:40; opacity:0;
    transition:opacity .22s ease; pointer-events:none;
  }
  #sheet-scrim.open{opacity:1; pointer-events:auto;}
  #sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:41;
    background:var(--surface); border-radius:26px 26px 0 0;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.25,1);
    max-height:88%; display:flex; flex-direction:column;
    box-shadow:0 -18px 40px -18px rgba(var(--shadow)/.4);
  }
  #sheet.open{transform:translateY(0);}
  #sheet .grabber{width:36px; height:4px; border-radius:3px; background:var(--line); margin:10px auto 2px;}
  #sheet .sheet-head{padding:8px 20px 4px; flex:none;}
  #sheet .sheet-body{overflow-y:auto; padding:6px 20px 22px;}

  /* ============ SCREEN TRANSITION ============ */
  .view{animation:view-in .22s ease both;}
  @keyframes view-in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){
    #phone, .view, #sheet, #sheet-scrim{animation:none !important; transition:none !important;}
  }

  /* ============ ONBOARDING SPECIFIC ============ */
  .brand{display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;}
  .badge-mark{
    width:64px; height:64px; border-radius:20px; background:var(--ink); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-family:'Big Shoulders Display';
    font-weight:800; font-size:26px; margin-bottom:6px; letter-spacing:0;
  }
  .logo-badge{
    width:112px; height:112px; border-radius:50%; background:#fff;
    display:flex; align-items:center; justify-content:center; padding:10px;
    margin-bottom:10px; box-shadow:0 8px 20px -8px rgba(var(--shadow)/.4), 0 0 0 1px var(--line);
    flex:none;
  }
  .logo-badge img{width:100%; height:100%; object-fit:contain; display:block;}
  .lede{color:var(--ink-soft); font-size:14px; max-width:280px; margin:0 auto;}
  .divider-or{display:flex; align-items:center; gap:10px; color:var(--ink-faint); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;}
  .divider-or::before,.divider-or::after{content:""; flex:1; height:1px; background:var(--line);}

  /* light-switch toggle */
  #daynight{
    position:absolute; top:14px; right:14px; z-index:30;
    width:46px; height:26px; border-radius:99px; border:1px solid var(--line);
    background:var(--surface-2); display:flex; align-items:center; padding:2px;
  }
  #daynight .knob{
    width:20px; height:20px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center; transition:transform .22s ease;
    box-shadow:0 1px 3px rgba(0,0,0,.3);
  }
  #daynight .knob svg{width:12px; height:12px; stroke:var(--accent-ink); fill:none; stroke-width:2.4;}
  #daynight.night .knob{transform:translateX(20px);}

  /* fee breakdown */
  .feeline{display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0;}
  .feeline.total{border-top:1px solid var(--line); margin-top:4px; padding-top:10px; font-weight:800; font-size:15px;}

  /* segmented control */
  .seg{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:3px; gap:2px;}
  .seg button{flex:1; border:none; background:none; padding:9px 4px; border-radius:9px; font-weight:700; font-size:13px; color:var(--ink-soft);}
  .seg button.active{background:var(--accent); color:var(--accent-ink);}

  .hr{height:1px; background:var(--line); border:none; margin:2px 0;}

  .emptywrap{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:56px 24px;}
  .emptywrap svg{width:44px; height:44px; stroke:var(--ink-faint); fill:none; stroke-width:1.6;}

  .avatar{width:36px; height:36px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:var(--ink-soft); flex:none;}

  /* ============ MOBILE: FULL SCREEN LINK ============ */
  @media (max-width:700px){
    #stage{padding:0; min-height:100dvh; align-items:stretch;}
    #stage::before{display:none;}
    .stage-caption{display:none;}
    #phone{
      width:100vw; height:100dvh; height:100svh; border-radius:0; padding:0; box-shadow:none; animation:none;
    }
    #phone::after{display:none;}
    #screen{border-radius:0; border:none; height:100%;}
    #home-indicator{display:none;}
    #daynight{top:calc(10px + env(safe-area-inset-top,0px));}
  }
</style>
</head>
<body style="margin:0;">

<div id="stage">
  <div id="phone">
    <div id="screen">
      <button id="daynight" onclick="toggleTheme()" aria-label="Toggle day and night"><span class="knob"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle></svg></span></button>
      <div class="statusbar" id="statusbar">
        <span id="clock">18:04</span>
        <span class="sb-icons">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="6" width="3" height="5" rx="1" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" rx="1" fill="currentColor"/><rect x="9" y="2" width="3" height="9" rx="1" fill="currentColor"/><rect x="13.5" y="0" width="2.5" height="11" rx="1" fill="currentColor" opacity=".35"/></svg>
          <svg width="18" height="11" viewBox="0 0 24 12" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="currentColor"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.2" fill="currentColor"/><rect x="21.5" y="4" width="1.6" height="4" rx="0.8" fill="currentColor"/></svg>
        </span>
      </div>
      <div id="viewport" class="viewport"></div>
      <nav class="tabbar" id="tabbar" style="display:none"></nav>
      <div id="home-indicator"></div>
      <div id="sheet-scrim" onclick="closeSheet()"></div>
      <div id="sheet" role="dialog" aria-modal="true">
        <div class="grabber"></div>
        <div class="sheet-head"><h2 id="sheet-title" style="font-size:20px;"></h2></div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>
  </div>
  <div class="stage-caption">GrootBrak Squash — interactive prototype · resize narrower or open on a phone for full-screen</div>
</div>

<script>
/* ================= STATE ================= */
const state = {
  route: 'welcome',
  history: ['welcome'],

const DAYS = (()=>{
  const out=[]; const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const base = new Date(2026,8,10); // Thu 10 Sep 2026, matches BRS date
  for(let i=0;i<8;i++){ const d=new Date(base); d.setDate(base.getDate()+i); out.push({label:names[d.getDay()], num:d.getDate(), offset:i}); }
  return out;
})();

function fmtR(n){
  const neg = n<0; n=Math.abs(n);
  return (neg?'-':'')+'R'+n.toFixed(2);
}

/* ================= THEME ================= */
function toggleTheme(){
  state.theme = state.theme==='light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('daynight').classList.toggle('night', state.theme==='dark');
}

/* ================= ROUTER ================= */
function go(route, push=true){
  state.route = route;
  if(push) state.history.push(route);
  render();
}
function back(){
  state.history.pop();
  state.route = state.history[state.history.length-1] || 'welcome';
  render();
}
function goTab(tab){
  state.tab = tab; state.route = tab; state.history=[tab]; render();
  if(tab==='schedule') requestAnimationFrame(scrollToNow);
}

function render(){
  const onboarding = ['welcome','signin','check-email','join-landing','join-form','join-payment','join-success'];
  const tabbar = document.getElementById('tabbar');
  const isTabScreen = TABS.some(t=>t.id===state.route);
  tabbar.style.display = (isTabScreen || state.route==='admin' || state.route==='admin-member') ? 'flex' : 'none';
  if(isTabScreen){
    tabbar.innerHTML = TABS.map(t=>`
      <button class="tabbtn ${t.id===state.tab?'active':''}" onclick="goTab('${t.id}')">
        <svg viewBox="0 0 24 24">${t.icon}</svg>${t.label}
      </button>`).join('');
  } else if(state.route==='admin' || state.route==='admin-member'){
    tabbar.innerHTML = `<button class="tabbtn active" onclick="goTab('schedule')"><svg viewBox="0 0 24 24"><path d="M10 19l-7-7 7-7M4 12h17"/></svg>Exit admin</button>`;
  }

  const vp = document.getElementById('viewport');
  vp.innerHTML = `<div class="view">${SCREENS[state.route]()}</div>`;
  vp.scrollTop = 0;
}

/* ================= FEE ENGINE (BRS Section 7.2 / REQ-BOOK-03) ================= */
function computeFee(tier, minutes, oppType, cover){
  const base = 0.22, penalty=0.44, familyFlat=0.44;
  let lines = [];
  if(oppType==='none'){
    if(tier==='family'){ lines.push({label:'Court Light Fees', rate:familyFlat, mine:true}); }
    else { lines.push({label:'Court Light Fees', rate:base+penalty, mine:true}); }
  } else if(oppType==='member'){
    if(cover){
      // REQ-OPP-04: booking member covers the full solo-equivalent rate; opponent named, never billed.
      if(tier==='family'){ lines.push({label:'Court Light Fees', rate:familyFlat, mine:true, covering:true}); }
      else { lines.push({label:'Court Light Fees', rate:base+penalty, mine:true, covering:true}); }
    } else {
      // REQ-OPP-01 default: split — opponent's share is pending their own confirmation, not charged now.
      lines.push({label:'Court Light Fees – Shared', rate:base, mine:true});
      lines.push({label:'Court Light Fees – Shared', rate:base, mine:false, opp:true, pending:true});
    }
  } else if(oppType==='visitor'){
    if(tier==='family'){ lines.push({label:'Court Light Fees', rate:familyFlat, mine:true}); }
    else{
      lines.push({label:'Court Light Fees', rate:base, mine:true});
      lines.push({label:'Court Visitor Fees', rate:penalty, mine:true, visitor:true});
    }
  }
  return lines.map(l=>({...l, amount: l.rate*minutes}));
}

function dateBar(){
  return `<div class="datebar">${DAYS.map(d=>`
    <button class="datechip ${d.offset===state.selectedDay?'active':''}" onclick="state.selectedDay=${d.offset}; render()">
      <div class="d">${d.label}</div><div class="n">${d.num}</div>
    </button>`).join('')}</div>`;
}

function slotAt(court, day, hh, mm){
  const time = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  const mine = state.bookings.find(b=>b.court===court && b.day===day && b.start<=time && time<b.end);
  if(mine) return {type:'mine', label: mine.opp ? mine.opp.split(' (')[0] : 'You', sub: mine.comp||'Your booking', start:mine.start, end:mine.end, first: mine.start===time};
  if(day===0 && court===2 && time==='17:30') return {type:'active', label:'B Viljoen', sub:'Active now · 17:47–18:32', start:'17:30', end:'18:30', first:true};
  if(day===0 && court===2 && time==='18:00') return {type:'active', label:'B Viljoen', sub:'Active now', start:'17:30', end:'18:30', first:false};
  if(day===0 && court===1 && time==='20:00') return {type:'other', label:'J Botha [Visitor]', sub:'Booked', start:'20:00', end:'21:00', first:true};
  if(day===0 && court===1 && time==='20:30') return {type:'other', label:'J Botha [Visitor]', sub:'Booked', start:'20:00', end:'21:00', first:false};
  if(day===2 && court===1 && time==='19:30') return {type:'other', label:'PJ Retief', sub:'Booked', start:'19:30', end:'20:00', first:true};
  return {type:'free'};
}

const SECTIONS = [
  {id:'morning', label:'Morning', from:6, to:12},
  {id:'afternoon', label:'Afternoon', from:12, to:17},
  {id:'evening', label:'Evening', from:17, to:20},
  {id:'night', label:'Night', from:20, to:22},
];

function switchCourt(c){ state.court=c; render(); requestAnimationFrame(scrollToNow); }
function jumpTo(id){
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'});
}
function scrollToNow(){
  const el = document.querySelector('.nowline');
  if(el) el.scrollIntoView({block:'center'});
}

SCREENS['schedule'] = ()=>{
  const court = state.court || 1;
  const bookedHrs = state.bookings.reduce((s,b)=>{
    const [sh,sm]=b.start.split(':').map(Number), [eh,em]=b.end.split(':').map(Number);
    return s + (eh+em/60-sh-sm/60);
  },0);

  let html = ''; let openSection = null;
  for(let hh=6; hh<22; hh++){
    for(const mm of [0,30]){
      const label = `${String(hh).padStart(2,'0')}:${mm===0?'00':'30'}`;
      const sec = SECTIONS.find(s=>hh>=s.from && hh<s.to);
      if(sec && sec.id!==openSection){ openSection=sec.id; html += `<div class="sectionhead" id="sec-${sec.id}">${sec.label}</div>`; }
      if(state.selectedDay===0 && label==='18:00'){ html += `<div class="nowline"><span class="lb">NOW · 18:04</span><span class="ln"></span></div>`; }
      const s = slotAt(court, state.selectedDay, hh, mm);
      const cont = s.type!=='free' && !s.first;
      if(s.type==='free'){
        html += `<button class="timerow" onclick="openBookSheet(${court},'${label}')">
          <span class="tm">${label}</span><span class="dot"></span>
          <span class="info"><div class="t1">Open</div></span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </button>`;
      } else {
        html += `<div class="timerow ${s.type} ${cont?'cont':''}">
          <span class="tm">${cont?'':label}</span><span class="dot"></span>
          <span class="info">
            ${cont ? '' : `<div class="t1">${s.label}${s.type==='active'&&s.first?'<span class=\"live-tag\">LIVE</span>':''}</div><div class="t2">${s.sub} · ${s.start}–${s.end}</div>`}
          </span>
        </div>`;
      }
    }
  }

  return `
  ${appbar('Schedule', `today + 8 days`, false, `<span class="pill-accent">${bookedHrs.toFixed(1)}h / 4h</span>`)}
  ${dateBar()}
  <div class="sched-pinned">
    <div class="seg courttoggle">
      <button class="${court===1?'active':''}" onclick="switchCourt(1)">Court 1</button>
      <button class="${court===2?'active':''}" onclick="switchCourt(2)">Court 2</button>
    </div>
    <div class="quickjump">
      <button class="qchip now" onclick="scrollToNow()">Now</button>
      ${SECTIONS.map(s=>`<button class="qchip" onclick="jumpTo('sec-${s.id}')">${s.label}</button>`).join('')}
    </div>
  </div>
  <div class="timelist">${html}</div>
  `;
};

function oppPill(b){
  if(b.oppStatus==='pending') return `<span class="pill-warn">Awaiting ${b.opp}'s confirmation</span>`;
  if(b.oppStatus==='confirmed') return `<span class="pill-good">Confirmed by ${b.opp}</span>`;
  if(b.oppStatus==='covered') return `<span class="pill-accent">You're covering the cost</span>`;
  return '';
}

/* ================= SHEETS ================= */
function openSheet(title, bodyHtml){
  document.getElementById('sheet-title').textContent = title;
  document.getElementById('sheet-body').innerHTML = bodyHtml;
  document.getElementById('sheet').classList.add('open');
  document.getElementById('sheet-scrim').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('sheet-scrim').classList.remove('open');
}

let draftDuration=60, draftOpp='none', draftCover=false, draftOppName='L Marais', draftVisitorEmail='';
function openBookSheet(court, time){
  state.draft.court=court; state.draft.start=time; draftDuration=60; draftOpp='none'; draftCover=false; draftVisitorEmail='';
  renderBookSheet();
}
function renderBookSheet(){
  const tier = state.member && state.member.tier==='family' ? 'family' : 'single';
  const lines = computeFee(tier, draftDuration, draftOpp, draftCover);
  const total = lines.reduce((s,l)=>l.mine?s+l.amount:s,0);
  const bal = state.txns[0].bal;
  const oppLine = lines.find(l=>l.opp);
  const coveringLine = lines.find(l=>l.covering);
  // REQ-BOOK-04 (11 Sept 2026): when splitting with a member, the booking member's balance must
  // cover the FULL solo-equivalent rate up front — not just their own share — since they're the
  // guaranteed fallback payer if the opponent never confirms by light activation (REQ-OPP-03).
  const isSplit = draftOpp==='member' && !draftCover;
  const fallbackTotal = isSplit ? computeFee(tier, draftDuration, 'none', false).reduce((s,l)=>s+l.amount,0) : total;
  const short = fallbackTotal>bal;
  const body = `
    <div class="row between" style="margin-bottom:12px;">
      <span class="chip on">${iconCourt()} Court ${state.draft.court}</span>
      <span class="chip">${state.draft.start} · today</span>
    </div>
    <div class="field"><label>Duration</label>
      <div class="seg">
        <button class="${draftDuration===30?'active':''}" onclick="draftDuration=30; renderBookSheet()">30 min</button>
        <button class="${draftDuration===60?'active':''}" onclick="draftDuration=60; renderBookSheet()">60 min</button>
        <button class="${draftDuration===90?'active':''}" onclick="draftDuration=90; renderBookSheet()">90 min</button>
      </div>
    </div>
    <div class="field"><label>Opponent</label>
      <div class="seg">
        <button class="${draftOpp==='none'?'active':''}" onclick="draftOpp='none'; renderBookSheet()">Solo</button>
        <button class="${draftOpp==='member'?'active':''}" onclick="draftOpp='member'; renderBookSheet()">Member</button>
        <button class="${draftOpp==='visitor'?'active':''}" onclick="draftOpp='visitor'; renderBookSheet()">Visitor</button>
      </div>
    </div>
    ${draftOpp==='member'?`<div class="field"><label>Search members</label><input placeholder="L Marais" value="${draftOppName}" oninput="draftOppName=this.value"></div>
    <div class="field"><label>Light fee</label>
      <div class="seg">
        <button class="${!draftCover?'active':''}" onclick="draftCover=false; renderBookSheet()">Split with ${draftOppName||'them'}</button>
        <button class="${draftCover?'active':''}" onclick="draftCover=true; renderBookSheet()">I'll cover it</button>
      </div>
    </div>`:''}
    ${draftOpp==='visitor'?`<div class="field"><label>Visitor name</label><input placeholder="G Zimmerman" value="G Zimmerman"></div>
    <div class="field"><label>Visitor email <span class="faint">(optional — sends them the booking details)</span></label><input type="email" placeholder="visitor@example.com" value="${draftVisitorEmail}" oninput="draftVisitorEmail=this.value"></div>`:''}
    <div class="card" style="margin-top:6px;">
      ${lines.filter(l=>l.mine).map(l=>`<div class="feeline"><span>${l.label}${l.covering?' (covering both)':''}</span><span class="num">${fmtR(l.amount)}</span></div>`).join('')}
      ${oppLine?`<div class="feeline faint"><span>${draftOppName||'Opponent'}'s share — pending their confirmation</span><span class="num">${fmtR(oppLine.amount)}</span></div>`:''}
      <div class="feeline total"><span>Charged now</span><span class="num">${fmtR(total)}</span></div>
      ${isSplit?`<div class="feeline faint"><span>Reserved — full rate if ${draftOppName||'they'} don't confirm</span><span class="num">${fmtR(fallbackTotal)}</span></div>`:''}
    </div>
    ${draftOpp==='member' && !draftCover?`<p class="faint" style="font-size:11.5px; margin-top:8px;">${draftOppName||'They'} will get a notification to confirm and pay their share, any time up until the lights go on for this session. The slot is booked now either way — if they haven't confirmed by then, you're automatically billed the full rate instead, so your balance needs to cover that worst case now, not just your own share.</p>`:''}
    ${draftOpp==='member' && draftCover?`<p class="faint" style="font-size:11.5px; margin-top:8px;">${draftOppName||'They'} will be notified they've been added — no payment requested from them.</p>`:''}
    ${short?`<div class="pill-warn" style="display:block; text-align:center; padding:8px;">Balance too low — top up R${(fallbackTotal-bal).toFixed(2)} to continue${isSplit?' (covers the full-rate fallback, not just your split share)':''}</div>`:''}
    <button class="btn btn-primary" style="margin-top:12px;" ${short?'disabled':''} onclick="confirmBooking(${total})">${short?'Top up to book':'Confirm booking · '+fmtR(total)}</button>
    ${short?`<button class="btn btn-secondary" style="margin-top:8px;" onclick="openTopupSheet(true)">Top up now</button>`:''}
  `;
  openSheet('Book a slot', body);
}
function confirmBooking(total){
  const booking = {id: Date.now(), day: state.selectedDay, court: state.draft.court, start: state.draft.start, end: state.draft.start, comp:null};
  if(draftOpp==='member'){
    const tier = state.member && state.member.tier==='family' ? 'family' : 'single';
    booking.opp = draftOppName || 'Opponent';
    if(draftCover){
      booking.oppStatus = 'covered';
    } else {
      const lines = computeFee(tier, draftDuration, 'member', false);
      const myShareAlready = lines.filter(l=>l.mine).reduce((s,l)=>s+l.amount,0);
      const soloTotal = computeFee(tier, draftDuration, 'none', false).reduce((s,l)=>s+l.amount,0);
      booking.oppStatus = 'pending';
      booking.oppShare = lines.find(l=>l.opp).amount; // for display: what THEY would pay if they confirm
      booking.fallbackDelta = soloTotal - myShareAlready; // REQ-OPP-03: what's actually charged if they don't (solo rate minus what's already been charged — not simply their share)
    }
  } else if(draftOpp==='visitor'){
    booking.opp = 'Visitor';
    booking.visitorEmail = draftVisitorEmail || null;
  } else {
    booking.opp = null;
  }
  state.bookings.push(booking);
  closeSheet();
  const bal = state.txns[0].bal - total;
  state.txns.unshift({t:'Court Light Fees', sub:`Court ${state.draft.court} · ${state.draft.start} today`, amt:-total, bal});
  const emailNote = booking.visitorEmail ? `<p class="muted" style="font-size:13px;">We also emailed the booking details to ${booking.visitorEmail}.</p>` : '';
  const oppNote = booking.oppStatus==='pending' ? `<p class="muted" style="font-size:13px;">${booking.opp} has been notified to confirm and pay their share.</p>` : (booking.oppStatus==='covered' ? `<p class="muted" style="font-size:13px;">${booking.opp} has been notified — no payment requested from them.</p>` : '');
  setTimeout(()=>openSheet('Booked ✓', `<div class="emptywrap" style="padding:20px 0 8px;"><svg viewBox="0 0 24 24" stroke="var(--good)"><path d="M20 6 9 17l-5-5"/></svg><p style="font-weight:700;">Court ${state.draft.court} confirmed for ${state.draft.start}</p><p class="muted" style="font-size:13px;">A confirmation email is on its way.</p>${oppNote}${emailNote}</div><button class="btn btn-secondary" onclick="closeSheet(); goTab('bookings')">View my bookings</button>`), 120);
  render();
}

function openCancelSheet(id){
  const b = state.bookings.find(x=>x.id===id);
  const within24 = b.day===0;
  const body = within24 ? `
    <div class="pill-warn" style="display:inline-block; margin-bottom:10px;">Less than 24 hours away</div>
    <p style="font-size:14px;">Cancelling now means the <strong>full fee still applies and won't be refunded</strong> — but the slot reopens immediately for another member.</p>
    <button class="btn btn-danger" style="margin-top:14px;" onclick="doCancel(${id})">Cancel anyway, forfeit fee</button>
    <button class="btn btn-ghost" onclick="closeSheet()">Keep my booking</button>
  ` : `
    <p style="font-size:14px;">This booking is more than 24 hours away — cancelling is <strong>free</strong> and any fee paid will be refunded to your Light Account.</p>
    <button class="btn btn-danger" style="margin-top:14px;" onclick="doCancel(${id})">Cancel &amp; refund</button>
    <button class="btn btn-ghost" onclick="closeSheet()">Keep my booking</button>
  `;
  openSheet('Cancel booking', body);
}
function doCancel(id){
  state.bookings = state.bookings.filter(b=>b.id!==id);
  closeSheet(); render();
}

/* REQ-OPP-01/03 demo: simulate the opponent's own device confirming their share, any time up until light activation */
function simulateOpponentConfirm(id){
  const b = state.bookings.find(x=>x.id===id);
  if(!b) return;
  b.oppStatus = 'confirmed';
  render();
  setTimeout(()=>openSheet('Confirmed ✓', `<div class="emptywrap" style="padding:20px 0 8px;"><svg viewBox="0 0 24 24" stroke="var(--good)"><path d="M20 6 9 17l-5-5"/></svg><p style="font-weight:700;">${b.opp} confirmed and paid their share</p><p class="muted" style="font-size:13px;">This simulates ${b.opp} tapping "Confirm" on their own device — their ${fmtR(b.oppShare)} share is now charged to their own Light Account, not yours.</p></div><button class="btn btn-secondary" onclick="closeSheet()">Close</button>`), 120);
}
/* REQ-OPP-03: fallback billing — automatic and unconditional, no choice presented to the booking member.
   Triggers either immediately (opponent explicitly declines) or at light activation (opponent never responded). */
function simulateOpponentUnresolved(id, reason){
  const b = state.bookings.find(x=>x.id===id);
  if(!b) return;
  const amt = b.fallbackDelta;
  const bal = state.txns[0].bal - amt;
  state.txns.unshift({t:'Court Light Fees', sub:`${b.opp} didn't confirm · Court ${b.court}`, amt:-amt, bal});
  b.oppStatus = 'covered';
  delete b.oppShare;
  delete b.fallbackDelta;
  render();
  const headline = reason==='decline' ? `${b.opp} declined` : 'Lights on — no response';
  const detail = reason==='decline'
    ? `${b.opp} declined to pay their share, so you were billed the full rate immediately — no choice was needed, it's automatic.`
    : `${b.opp} never confirmed before the session's light activation, so you were automatically billed the full rate — this is a guaranteed fallback, not a prompt asking you to decide.`;
  setTimeout(()=>openSheet(headline, `<p style="font-size:14px;">${detail}</p><div class="card" style="margin-top:10px;"><div class="feeline total"><span>Charged to you just now</span><span class="num">${fmtR(amt)}</span></div></div><p class="faint" style="font-size:11.5px; margin-top:10px;">You could still have cancelled the booking any time before this per the normal REQ-MANAGE-02 policy — that option doesn't disappear because of this rule.</p><button class="btn btn-secondary" style="margin-top:12px;" onclick="closeSheet()">Close</button>`), 120);
}

function openTopupSheet(fromShortfall){
  let amt = 200;
  const body = ()=>`
    <div class="row" style="gap:8px; margin-bottom:12px;">
      ${[100,200,500].map(v=>`<button class="chip ${amt===v?'on':''}" style="flex:1; justify-content:center; padding:12px;" onclick="window.__topupAmt=${v}; document.getElementById('topup-body').innerHTML=window.__topupBody(${v})">${fmtR(v)}</button>`).join('')}
    </div>
    <div class="field"><label>Or enter a custom amount</label><input type="number" placeholder="150" value="${amt}"></div>
    <button class="btn btn-primary" style="margin-top:14px;" onclick="doTopup(${amt})">Pay ${fmtR(amt)} via PayFast</button>
  `;
  window.__topupBody = body;
  openSheet('Top up Light Account', `<div id="topup-body">${body()}</div>`);
}
function doTopup(amt){
  const bal = state.txns[0].bal + amt;
  state.txns.unshift({t:'Light Account Top-up', sub:'PayFast · just now', amt, bal});
  closeSheet(); render();
}
function openRenewSheet(){
  openSheet('Membership', `
    <p style="font-size:14px;">Your Single membership is <strong style="color:var(--good)">paid up</strong> until 28 Feb 2027.</p>
    <p class="muted" style="font-size:13px; margin-top:8px;">Renewal opens automatically from 1 March. There's no cancellation or refund on membership fees once paid.</p>
    <button class="btn btn-secondary" style="margin-top:14px;" onclick="closeSheet()">Close</button>
  `);
}
